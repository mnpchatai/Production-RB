// ลบบันทึกผลผลิตต้องย้อน transaction คลังที่เกิดจากบันทึกนั้นด้วย ไม่งั้นสต็อกเพี้ยน
function deleteLog(orderId, logId){
  const o = findOrder(orderId); if(!o) return;
  const l = o.logs.find(x=>x.id===logId); if(!l) return;
  const used = num(l.good) + num(l.scrap);
  o.logs = o.logs.filter(x=>x.id!==logId);
  o.produced = sum(o.logs, x=>num(x.good));
  o.scrapped = sum(o.logs, x=>num(x.scrap));
  // ย้อนของที่รับเข้า/ของเสีย/วัตถุดิบที่เบิกไปในวันเดียวกันของใบสั่งนี้
  DB.txns.push({id:uid('TX'), ts:Date.now(), code:o.item, qty:-used, type:'ADJUST', ref:o.id, note:'ยกเลิกบันทึกผลผลิต ' + fmtDate(l.date), by:state.user.name});
  if(num(l.scrap) > 0) DB.txns.push({id:uid('TX'), ts:Date.now(), code:o.item, qty:num(l.scrap), type:'ADJUST', ref:o.id, note:'ยกเลิกการตัดของเสียของบันทึกเดียวกัน', by:state.user.name});
  bomChildren(o.item).forEach(b=>{
    const q = Math.round(used * num(b.qty) * (1 + num(b.scrap)/100) * 1000)/1000;
    if(q > 0) DB.txns.push({id:uid('TX'), ts:Date.now(), code:b.child, qty:q, type:'ADJUST', ref:o.id, note:'คืนวัตถุดิบจากการยกเลิกบันทึก', by:state.user.name});
  });
  invalidateInv();
  pushTimeline(o, 'ลบบันทึกผลผลิตวันที่ ' + fmtDate(l.date) + ' และย้อนรายการคลังแล้ว', 'bad');
  saveDB();
  toast('ลบบันทึกและย้อนรายการคลังแล้ว', 'warn');
  render();
}

/* ---------- แผนการผลิต (Gantt + โหลดกำลังการผลิต) ---------- */
VIEWS.schedule = function(){
  const ui = state.ui.schedule;
  const today = todayIso();
  const from = addDays(today, -3);
  const to = addDays(today, ui.days);
  const span = daysBetween(from, to) + 1;
  const pxPct = d=>(daysBetween(from, d) / span * 100);

  let orders = activeOrders().concat(DB.orders.filter(o=>o.status==='PLANNED'));
  if(ui.dept) orders = orders.filter(o=>o.dept === ui.dept);
  // ตัดงานที่อยู่นอกกรอบเวลาที่ดูอยู่
  orders = orders.filter(o=>daysBetween(o.due, from) <= 0 && daysBetween(to, o.start) <= 0);

  // จัดกลุ่มตามเครื่องจักร งานที่ยังไม่กำหนดเครื่องไปอยู่แถวรวม
  const groups = {};
  orders.forEach(o=>{
    const k = o.machine || '(ยังไม่กำหนดเครื่อง)';
    (groups[k] = groups[k] || []).push(o);
  });
  const machineKeys = DB.machines
    .filter(m=>!ui.dept || m.dept === ui.dept)
    .map(m=>m.code)
    .filter(c=>groups[c])
    .concat(groups['(ยังไม่กำหนดเครื่อง)'] ? ['(ยังไม่กำหนดเครื่อง)'] : []);

  // เส้นวันที่บนแกน — แสดงทุก 2-3 วันไม่ให้ตัวหนังสือทับกัน
  const tickEvery = span > 30 ? 5 : span > 18 ? 3 : 2;
  const ticks = [];
  for(let d=0; d<span; d+=tickEvery) ticks.push(addDays(from, d));

  // โหลดกำลังการผลิตรายแผนก: ชั่วโมงที่งานต้องใช้ เทียบชั่วโมงที่มี
  const dayList = [];
  for(let d=0; d<=ui.days; d++){ const iso = addDays(today, d); if(isWorkday(iso)) dayList.push(iso); }
  const load = DEPTS.map(dep=>{
    const deptOrders = orders.filter(o=>o.dept===dep.code);
    const hoursNeeded = sum(deptOrders, o=>{
      const it = itemOf(o.item);
      const remain = Math.max(0, num(o.qty) - num(o.produced));
      return num(it && it.rate) > 0 ? remain / num(it.rate) : 0;
    });
    const machines = DB.machines.filter(m=>m.dept===dep.code && m.status!=='DOWN');
    const hoursAvail = machines.length * dayList.length * 8;
    return {dept:dep, hoursNeeded, hoursAvail, machines:machines.length,
            util: hoursAvail > 0 ? hoursNeeded / hoursAvail * 100 : (hoursNeeded > 0 ? 999 : 0)};
  }).filter(l=>l.hoursNeeded > 0 || l.machines > 0);

  return `
  ${h_header('RB · SCHEDULE', 'แผนการผลิต',
    'ตารางเวลางานที่ปล่อยเข้าสายการผลิตแล้ว เรียงตามเครื่องจักร — แถบสีคือช่วงตั้งแต่วันเริ่มถึงกำหนดเสร็จ เส้นประสีส้มคือวันนี้',
    `<div class="seg">
       ${[7,14,21,45].map(d=>`<button class="${ui.days===d?'on':''}" onclick="uset('schedule.days',${d})">${d} วัน</button>`).join('')}
     </div>`)}

  <div class="panel">
    <div class="toolbar">
      <div class="fgroup">
        <span class="flabel">แผนก</span>
        <select class="select" onchange="uset('schedule.dept',this.value)">
          <option value="">ทุกแผนก</option>
          ${DEPTS.map(d=>`<option value="${d.code}"${ui.dept===d.code?' selected':''}>${esc(d.name)}</option>`).join('')}
        </select>
      </div>
      <div class="fgroup" style="justify-content:flex-end;">
        <span class="flabel">&nbsp;</span>
        <span class="meta-chip">งานในกรอบเวลา <b>${fmt(orders.length)}</b> ใบ</span>
      </div>
    </div>

    ${machineKeys.length ? `
    <div class="gantt-axis">
      <div></div>
      <div class="gantt-scale">
        ${ticks.map(t=>`<div class="gantt-day" style="left:${pxPct(t).toFixed(2)}%">${fmtDate(t)}</div>`).join('')}
      </div>
    </div>
    <div class="gantt">
      ${machineKeys.map(mk=>{
        const m = machineOf(mk);
        const list = sortBy(groups[mk], o=>o.start, 'asc');
        return `<div class="gantt-row">
          <div class="gantt-name">${esc(m ? m.code : mk)}
            <small>${esc(m ? m.name : 'รอจัดสรรเครื่อง')}</small></div>
          <div class="gantt-track">
            ${ticks.map(t=>`<div class="gantt-grid" style="left:${pxPct(t).toFixed(2)}%"></div>`).join('')}
            <div class="gantt-today" style="left:${pxPct(today).toFixed(2)}%"></div>
            ${list.map(o=>{
              const l = clamp(pxPct(o.start), 0, 100);
              const r = clamp(pxPct(addDays(o.due,1)), 0, 100);
              const w = Math.max(1.2, r - l);
              const c = deptColor(o.dept);
              const late = daysBetween(today, o.due) < 0;
              const opacity = o.status==='PLANNED' ? .55 : 1;
              return `<div class="gantt-bar${late?' late':''}" style="left:${l.toFixed(2)}%;width:${w.toFixed(2)}%;background:${c};opacity:${opacity};"
                        title="${esc(o.id)} · ${esc(o.item)} · ${fmt(o.qty)} ${esc(itemUnit(o.item))} · ${fmtDate(o.start)}→${fmtDate(o.due)}"
                        onclick="openOrderDetail('${o.id}')"><span>${esc(o.id)}</span></div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="gantt-legend">
      ${DEPTS.filter(d=>orders.some(o=>o.dept===d.code)).map(d=>`<span><i style="background:${d.color}"></i>${esc(d.name)}</span>`).join('')}
      <span><i style="background:${DEPTS[3].color};opacity:.55"></i>สีจาง = ยังไม่ปล่อยงาน (วางแผน)</span>
      <span><i style="background:none;border-left:2px dashed var(--accent);width:0;height:14px;margin:0 9px;"></i>วันนี้</span>
      <span><i style="background:none;outline:1px solid var(--bad);"></i>เกินกำหนด</span>
    </div>` : h_empty('ไม่มีงานในกรอบเวลานี้', 'ลองขยายช่วงวันหรือเปลี่ยนแผนก')}
  </div>

  <div class="panel">
    <h3>โหลดกำลังการผลิตรายแผนก</h3>
    <div class="panel-note">ชั่วโมงที่งานค้างต้องใช้ เทียบกับชั่วโมงเครื่องที่มีใน ${fmt(dayList.length)} วันทำงานข้างหน้า (8 ชม./เครื่อง/วัน) — เกิน 100% แปลว่ากำลังการผลิตไม่พอตามแผนนี้</div>
    <div class="table-wrap"><table>
      <thead><tr><th>แผนก</th><th class="num">เครื่องที่ใช้ได้</th><th class="num">ชั่วโมงที่ต้องใช้</th><th class="num">ชั่วโมงที่มี</th><th>อัตราการใช้กำลังผลิต</th></tr></thead>
      <tbody>${load.map(l=>{
        const cls = l.util > 100 ? 'bad' : l.util > 85 ? 'warn' : 'good';
        return `<tr>
          <td>${h_deptTag(l.dept.code)}</td>
          <td class="num mono">${fmt(l.machines)}</td>
          <td class="num mono">${fmt(l.hoursNeeded,1)}</td>
          <td class="num mono">${fmt(l.hoursAvail,0)}</td>
          <td style="min-width:180px;">${h_bar(Math.min(l.util,140), 140, cls, l.util>=999?'ไม่มีเครื่อง':pct(l.util,0))}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`;
};

function doRunMrp(){
  const ui = state.ui.mrp;
  state.mrp = runMrp({horizon:num(ui.horizon,56), bucketDays:num(ui.bucket,7), includeSafetyStock:!!ui.ss, extraDemand:ui.extra});
  DB.mrpRuns.unshift({at:state.mrp.runAt, planned:state.mrp.planned.length, shortages:state.mrp.shortages.length,
                      horizon:state.mrp.horizon, bucketDays:state.mrp.bucketDays, by:state.user.name});
  DB.mrpRuns = DB.mrpRuns.slice(0,20);
  saveDB();
  toast('คำนวณ MRP เสร็จ — เสนอแผนสั่ง ' + state.mrp.planned.length + ' รายการ', 'good');
  render();
}

function createOneFromMrp(i){
  const p = state.mrp && state.mrp.planned[i];
  if(!p) return;
  if(p.type === 'PURCHASE'){ createPoFor([p]); }
  else { createWoFor([p]); }
  render();
}
function createPosFromMrp(){
  const buy = (state.mrp ? state.mrp.planned : []).filter(p=>p.type==='PURCHASE');
  if(!buy.length) return;
  createPoFor(buy);
  render();
}
function createWosFromMrp(){
  const make = (state.mrp ? state.mrp.planned : []).filter(p=>p.type==='MAKE');
  if(!make.length) return;
  createWoFor(make);
  render();
}
// รวมรายการของผู้ขายเดียวกันไว้ในใบสั่งซื้อใบเดียว
function createPoFor(list){
  const byVendor = groupBy(list, p=>p.vendor || 'V-NONE');
  let n = 0;
  Object.keys(byVendor).forEach(v=>{
    const lines = byVendor[v].map(p=>({code:p.code, qty:p.qty, price:num((itemOf(p.code)||{}).cost), received:0}));
    const eta = sortBy(byVendor[v], p=>p.need, 'asc')[0].need;
    const id = nextPoId();
    DB.pos.push({id, vendor:v==='V-NONE'?'':v, status:'DRAFT', createdAt:Date.now(), eta, lines,
                 note:'สร้างจากการคำนวณ MRP ' + fmtDateTime(state.mrp.runAt)});
    n++;
  });
  saveDB();
  toast('สร้างใบสั่งซื้อ ' + n + ' ใบ (สถานะร่าง) — ตรวจแล้วกดยืนยันสั่งซื้อในหน้าจัดซื้อ', 'good');
}
function createWoFor(list){
  list.forEach(p=>{
    const it = itemOf(p.code);
    let seq = DB.orders.length + 1;
    let id = 'WO-' + String(26000 + seq);

/* ---------- สูตรการผลิต (BOM) ---------- */
// ต้นทุนรวมแบบไล่ชั้น: ของที่ผลิตเองคิดจากผลรวมของลูก ของที่ซื้อคิดจากราคาทุน
function rolledCost(code, depth, seen){
  depth = depth || 0; seen = seen || [];
  const it = itemOf(code); if(!it) return 0;
  const kids = bomChildren(code);
  if(!kids.length || depth > 12 || seen.includes(code)) return num(it.cost);
  return kids.reduce((a,b)=>a + rolledCost(b.child, depth+1, seen.concat([code])) * num(b.qty) * (1 + num(b.scrap)/100), 0);
}

function submitBomLine(){
  const m = state.modal, f = m.form, errs = [];
  if(!f.child) errs.push('ต้องเลือกวัตถุดิบ');
  if(num(f.qty) <= 0) errs.push('ปริมาณต้องมากกว่า 0');
  if(f.child && !m.editing && DB.bom.some(b=>b.parent===m.parent && b.child===f.child)) errs.push('วัตถุดิบนี้อยู่ในสูตรแล้ว — ใช้ปุ่มแก้ไขแทน');
  if(f.child && bomHasCycle(m.parent, f.child)) errs.push('เลือกไม่ได้ — จะทำให้สูตรวนกลับมาหาตัวเอง');
  if(errs.length){ m.errors = errs; render(); return; }
  const exist = DB.bom.find(b=>b.parent===m.parent && b.child===f.child);
  if(exist){ exist.qty = num(f.qty); exist.scrap = num(f.scrap); }
  else DB.bom.push({parent:m.parent, child:f.child, qty:num(f.qty), scrap:num(f.scrap)});
  saveDB(); closeModal(); toast('บันทึกสูตรแล้ว', 'good');
}
function deleteBomLine(parent, child){
  DB.bom = DB.bom.filter(b=>!(b.parent===parent && b.child===child));
  saveDB(); toast('ลบบรรทัดสูตรแล้ว'); render();
}

function submitTxn(){
  const m = state.modal, f = m.form, errs = [];
  if(!f.code) errs.push('ต้องเลือกรายการ');
  if(num(f.qty) === 0) errs.push('จำนวนต้องไม่เป็น 0');
  if(f.type !== 'ADJUST' && num(f.qty) < 0) errs.push('ประเภทนี้ต้องกรอกจำนวนเป็นบวก');
  if(errs.length){ m.errors = errs; render(); return; }
  DB.txns.push({
    id:uid('TX'), ts:parseIso(f.date).getTime() + 12*3600000,
    code:f.code, qty:num(f.qty), type:f.type, ref:f.ref, note:f.note, by:state.user.name,
  });
  invalidateInv(); saveDB(); closeModal();
  toast('บันทึกรายการคลังแล้ว', 'good');
}

  DB.items.forEach(i=>{
    const oh = onHand(i.code);
    rows.push([i.code, i.name, ITEM_TYPES[i.type].label, i.unit, oh, allocated(i.code), oh-allocated(i.code),

}

function nextPoId(){
  let n = DB.pos.length + 1;
  let id = 'PO-' + String(26040 + n);
  while(DB.pos.some(p=>p.id===id)){ n++; id = 'PO-' + String(26040 + n); }
  return id;
}
function poTotal(p){ return sum(p.lines, l=>num(l.qty) * num(l.price)); }
function poReceivedPct(p){
  const q = sum(p.lines, l=>num(l.qty));
  return q > 0 ? sum(p.lines, l=>num(l.received)) / q * 100 : 0;
}
function findPo(id){ return DB.pos.find(p=>p.id===id) || null; }

function setRecv(i, v){ state.modal.form.recv[i].qty = num(v); render(); }
function submitReceive(){
  const m = state.modal, p = findPo(m.id), f = m.form;
  if(!p) return;
  const total = sum(f.recv, r=>num(r.qty));
  if(total <= 0){ m.errors = ['ยังไม่ได้กรอกจำนวนที่รับ']; render(); return; }
  const over = [];
  p.lines.forEach((l,i)=>{
    const q = num(f.recv[i] ? f.recv[i].qty : 0);
    if(q > Math.max(0, num(l.qty) - num(l.received)) + 1e-9) over.push(l.code);
  });
  if(over.length){ m.errors = ['รับเกินจำนวนที่ค้างรับ: ' + over.join(', ')]; render(); return; }

  const ts = parseIso(f.date).getTime() + 10*3600000;
  p.lines.forEach((l,i)=>{
    const q = num(f.recv[i] ? f.recv[i].qty : 0);
    if(q <= 0) return;
    l.received = num(l.received) + q;
    DB.txns.push({id:uid('TX'), ts, code:l.code, qty:q, type:'RECEIPT', ref:p.id, note:'', by:state.user.name});
  });
  const allDone = p.lines.every(l=>num(l.received) >= num(l.qty) - 1e-9);
  p.status = allDone ? 'RECEIVED' : 'PARTIAL';
  invalidateInv(); saveDB(); closeModal();
  toast('รับของเข้าคลังแล้ว' + (allDone ? ' — ใบสั่งซื้อนี้รับครบแล้ว' : ' (ยังรับไม่ครบ)'), 'good');
}

VIEWS.quality = function(){
  const ui = state.ui.quality;
  const today = todayIso();
  const from = addDays(today, -(ui.range - 1));
  let logs = allLogs().filter(l=>daysBetween(from, l.date) >= 0);
  if(ui.dept) logs = logs.filter(l=>l.dept === ui.dept);

  const good = sum(logs, l=>num(l.good)), scrap = sum(logs, l=>num(l.scrap));
  const rate = (good+scrap) > 0 ? scrap/(good+scrap)*100 : 0;
  const cost = sum(logs, l=>num(l.scrap) * num((itemOf(l.item)||{}).cost));

  // Pareto: สาเหตุเรียงมากไปน้อย + เส้นสะสม
  const byReason = {};
  logs.filter(l=>num(l.scrap)>0 && l.reason).forEach(l=>{ byReason[l.reason] = (byReason[l.reason]||0) + num(l.scrap); });
  const pareto = Object.entries(byReason).sort((a,b)=>b[1]-a[1]);
  const totalScrap = sum(pareto, e=>e[1]) || 1;
  let cum = 0;
  const cumData = pareto.map(e=>{ cum += e[1]; return +(cum/totalScrap*100).toFixed(1); });
  queueChart('qcPareto', {
    data:{
      labels:pareto.map(e=>e[0]),
      datasets:[
        {type:'bar', label:'จำนวนของเสีย', data:pareto.map(e=>e[1]), backgroundColor:'#e0616e', borderRadius:3, order:2, yAxisID:'y'},
        {type:'line', label:'สะสม %', data:cumData, borderColor:'#e8c13e', backgroundColor:'#e8c13e', tension:.25, pointRadius:3, order:1, yAxisID:'y1'},
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      plugins:{legend:{position:'top', align:'end', labels:{boxWidth:10, usePointStyle:true}}},
      scales:{
        x:{grid:{display:false}, ticks:{font:{size:10}, maxRotation:35, minRotation:0}},
        y:{grid:{color:'#232936'}, title:{display:true, text:'จำนวน'}},
        y1:{position:'right', min:0, max:100, grid:{display:false}, ticks:{callback:v=>v+'%'}},
      }
    }
  });

  // แนวโน้มอัตราของเสียรายวัน
  const days = [];
  for(let d=ui.range-1; d>=0; d--) days.push(addDays(today, -d));
  const byDay = groupBy(logs, l=>l.date);
  queueChart('qcTrend', {
    type:'line',
    data:{
      labels:days.map(fmtDate),
      datasets:[{
        label:'อัตราของเสีย %',
        data:days.map(d=>{
          const ls = byDay[d] || [];
          const g = sum(ls, l=>num(l.good)), s = sum(ls, l=>num(l.scrap));
          return (g+s) > 0 ? +(s/(g+s)*100).toFixed(2) : null;
        }),
        borderColor:'#e0616e', backgroundColor:'#e0616e22', fill:true, tension:.3, pointRadius:2, spanGaps:true,
      },{
        label:'เกณฑ์ 3%', data:days.map(()=>3), borderColor:'#4cc38a', borderDash:[5,4], fill:false, pointRadius:0,
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'top', align:'end', labels:{boxWidth:10, usePointStyle:true}}},
      scales:{x:{grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, maxTicksLimit:8}},
              y:{grid:{color:'#232936'}, ticks:{callback:v=>v+'%'}, beginAtZero:true}}
    }
  });

  // แยกรายสินค้า
  const byItem = groupBy(logs, l=>l.item);
  const itemRows = sortBy(Object.keys(byItem).map(code=>{
    const ls = byItem[code];
    const g = sum(ls, l=>num(l.good)), s = sum(ls, l=>num(l.scrap));
    return {code, good:g, scrap:s, rate:(g+s)>0?s/(g+s)*100:0, cost:s*num((itemOf(code)||{}).cost)};
  }), r=>r.rate, 'desc');

  return `
  ${h_header('RB · QUALITY', 'คุณภาพ',
    'วิเคราะห์ของเสียจากบันทึกผลผลิตจริง — แผนภูมิพาเรโตบอกว่าแก้สาเหตุไหนก่อนถึงจะลดของเสียได้มากที่สุด',
    `<div class="seg">${[7,30,60,90].map(d=>`<button class="${ui.range===d?'on':''}" onclick="uset('quality.range',${d})">${d} วัน</button>`).join('')}</div>`)}

  <div class="kpi-grid g4">
    ${h_kpi('อัตราของเสีย', pct(rate,2), {text: rate<=3?'อยู่ในเกณฑ์ ≤3%':'เกินเกณฑ์ 3%', cls:rate<=3?'good':'bad'}, rate<=3?'cg':'cb')}
    ${h_kpi('ของเสียรวม', fmt(scrap), {text:'จากผลผลิตรวม ' + fmt(good+scrap)}, 'cb')}
    ${h_kpi('มูลค่าที่เสียไป', fmt(cost,2) + '<small>' + esc(DB.settings.currency) + '</small>', {text:'คิดที่ต้นทุนมาตรฐาน'}, 'cw')}
    ${h_kpi('สาเหตุอันดับ 1', pareto.length?esc(pareto[0][0]):'—',
      {text:pareto.length?fmt(pareto[0][1]) + ' ชิ้น (' + pct(pareto[0][1]/totalScrap*100,0) + ' ของทั้งหมด)':'ไม่มีของเสีย'}, '')}
  </div>

  <div class="panel">
    <div class="toolbar">
      <div class="fgroup">
        <span class="flabel">แผนก</span>
        <select class="select" onchange="uset('quality.dept',this.value)">
          <option value="">ทุกแผนก</option>
          ${DEPTS.map(d=>`<option value="${d.code}"${ui.dept===d.code?' selected':''}>${esc(d.name)}</option>`).join('')}
        </select>
      </div>
    </div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h3>แผนภูมิพาเรโตของสาเหตุ</h3>
      <div class="panel-note">แท่งเรียงจากมากไปน้อย เส้นสีเหลืองคือสัดส่วนสะสม — จุดที่เส้นแตะ 80% คือกลุ่มสาเหตุที่ควรแก้ก่อน</div>
      ${pareto.length ? chartHolder('qcPareto') : h_empty('ไม่มีของเสียในช่วงนี้')}
    </div>
    <div class="panel">
      <h3>แนวโน้มอัตราของเสียรายวัน</h3>
      <div class="panel-note">เส้นประเขียวคือเกณฑ์ที่ยอมรับได้ 3%</div>
      ${chartHolder('qcTrend')}
    </div>
  </div>

  <div class="grid2b">
    <div class="panel" style="margin-bottom:0;">
      <h3>ของเสียรายสินค้า</h3>
      <div class="panel-note">เรียงตามอัตราของเสียจากสูงไปต่ำ</div>
      ${itemRows.length ? `<div class="table-wrap scroll-y"><table>
        <thead><tr><th>สินค้า</th><th class="num">ของดี</th><th class="num">ของเสีย</th><th>อัตรา</th><th class="num">มูลค่า</th></tr></thead>
        <tbody>${itemRows.map(r=>`<tr>
          <td><div class="mono acc-t">${esc(r.code)}</div><div class="faint" style="font-size:10.5px;white-space:normal;max-width:220px;">${esc(itemName(r.code))}</div></td>
          <td class="num mono">${fmt(r.good)}</td>
          <td class="num mono bad-t">${fmt(r.scrap)}</td>
          <td style="min-width:120px;">${h_bar(Math.min(r.rate,10), 10, r.rate<=3?'good':'bad', pct(r.rate,2))}</td>
          <td class="num mono">${fmt(r.cost,2)}</td>
        </tr>`).join('')}</tbody>
      </table></div>` : h_empty('ไม่มีข้อมูล')}
    </div>
    <div class="panel" style="margin-bottom:0;">
      <h3>บันทึกของเสียล่าสุด</h3>
      <div class="panel-note">คลิกเพื่อเปิดใบสั่งผลิตที่เกี่ยวข้อง</div>
      ${logs.filter(l=>num(l.scrap)>0).length ? `<div class="table-wrap scroll-y"><table>
        <thead><tr><th>วันที่</th><th>ใบสั่งผลิต</th><th>สาเหตุ</th><th class="num">จำนวน</th><th>พนักงาน</th></tr></thead>
        <tbody>${sortBy(logs.filter(l=>num(l.scrap)>0), l=>l.date, 'desc').slice(0,40).map(l=>`
          <tr class="rowclick" onclick="openOrderDetail('${l.order}')">
            <td class="mono nowrap">${fmtDate(l.date)}</td>
            <td class="mono">${esc(l.order)}<div class="faint" style="font-size:10px;">${esc(l.item)}</div></td>
            <td>${esc(l.reason||'—')}</td>
            <td class="num mono bad-t">${fmt(l.scrap)}</td>
            <td class="faint">${esc(l.emp||'—')}</td>
          </tr>`).join('')}</tbody>
      </table></div>` : h_empty('ไม่มีบันทึกของเสีย')}
    </div>
  </div>`;
};

function exportReport(kind){
  const ui = state.ui.reports;
  const today = todayIso();
  const from = addDays(today, -(ui.range - 1));
  const logs = allLogs().filter(l=>daysBetween(from, l.date) >= 0);
  let rows, name;
  const build = (keyf, nameF, head)=>{
    const g = groupBy(logs, keyf);
    const out = [[head,'ของดี','ของเสีย','อัตราของเสีย %','มูลค่าผลผลิต']];
    Object.keys(g).forEach(k=>{
      const ls = g[k], gd = sum(ls, l=>num(l.good)), sc = sum(ls, l=>num(l.scrap));
      out.push([nameF?nameF(k):k, gd, sc, (gd+sc)>0?(sc/(gd+sc)*100).toFixed(2):0,
                sum(ls, l=>num(l.good)*num((itemOf(l.item)||{}).cost)).toFixed(2)]);
    });
    return out;
  };
  if(kind === 'dept'){ rows = build(l=>l.dept||'—', deptName, 'แผนก'); name = 'report-dept'; }
  else if(kind === 'item'){ rows = build(l=>l.item, c=>c + ' — ' + itemName(c), 'สินค้า'); name = 'report-item'; }
  else if(kind === 'emp'){ rows = build(l=>l.emp||'ไม่ระบุ', null, 'พนักงาน'); name = 'report-employee'; }
  else {
    rows = [['รหัส','รายการ','ประเภท','คงเหลือ','หน่วย','ต้นทุน/หน่วย','มูลค่า','สต็อกกันชน','ต่ำกว่ากันชน']];
    DB.items.forEach(i=>{
      const oh = onHand(i.code);
      rows.push([i.code, i.name, ITEM_TYPES[i.type].label, oh, i.unit, i.cost, (oh*num(i.cost)).toFixed(2), i.ss, oh<num(i.ss)?'ใช่':'']);
    });
    name = 'report-stock';
  }
  downloadFile(name + '-' + today + '.csv', toCsv(rows), 'text/csv;charset=utf-8');
  toast('ส่งออกรายงานแล้ว', 'good');
}

function toggleWorkday(i){

    if(w.length <= 1){ toast('ต้องมีวันทำงานอย่างน้อย 1 วัน', 'bad'); return; }
    w.splice(at,1);
  } else w.push(i);

  saveDB(); render();
}

function importDb(input){

      const base = blankDB();

      d.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {});
      DB = d; invalidateInv(); state.mrp = null;

/* =========================================================================
   8b. ข้อมูลจริงจาก Supabase (ตาราง rb_*)
   ---------------------------------------------------------------------
   ส่วนนี้อ่านข้อมูลที่ย้ายมาจากไฟล์ Excel "ระบบวางแผนการสั่งงานแผนก RB V1.7.1"
   (ดูวิธีสร้างตารางและนำเข้าที่ supabase/rb_planning/README.md)

   แยกขาดจาก DB ของแอปเดโม — อ่านอย่างเดียว ไม่มีการเขียนกลับ
   คนละ schema กันคนละเรื่อง จึงไม่ยุ่งกับ DB.items / DB.orders เลย
   ========================================================================= */

const RB_CFG_KEY   = 'rb_supabase_cfg';
const RB_TOKEN_KEY = 'rb_supabase_token';
const RB_PAGE      = 1000;   // PostgREST ของ Supabase ส่งคืนสูงสุด 1000 แถวต่อครั้ง

const RBDATA = {
  status:'idle',        // idle | loading | ready | error
  error:'', loadedAt:null, cfg:null, token:null,
  books:[], formulas:[], standards:[], bom:[], orders:[],
  colors:[], customers:[], products:[],
  stdIdx:{},            // 'book|item_code' -> แถวมาตรฐาน
};

/* ---------- ตั้งค่าการเชื่อมต่อ ----------
   เก็บใน localStorage ไม่ใช่ในไฟล์ เพราะ repo เป็น public
   ถ้าไม่มีค่าใน localStorage จะถอยไปใช้ window.RB_SUPABASE_CONFIG ที่หัวไฟล์ */
function rbCfg(){
  if(RBDATA.cfg) return RBDATA.cfg;
  const c = {url:'', anonKey:''};
  try{
    const raw = localStorage.getItem(RB_CFG_KEY);
    if(raw) Object.assign(c, JSON.parse(raw) || {});
  }catch(e){}
  const inline = window.RB_SUPABASE_CONFIG || {};
  if(!c.url)     c.url     = String(inline.url || '').trim();
  if(!c.anonKey) c.anonKey = String(inline.anonKey || '').trim();
  c.url = String(c.url).trim().replace(/\/+$/, '');
  RBDATA.cfg = c;
  return c;
}
function rbSetCfg(key, value){
  const c = rbCfg();
  const v = String(value || '').trim();
  c[key] = key === 'url' ? v.replace(/\/+$/, '') : v;
  try{ localStorage.setItem(RB_CFG_KEY, JSON.stringify({url:c.url, anonKey:c.anonKey})); }catch(e){}
  RBDATA.status = 'idle';   // เปลี่ยนค่าเชื่อมต่อแล้วต้องโหลดใหม่
}
function rbConfigured(){ const c = rbCfg(); return !!(c.url && c.anonKey); }

/* ---------- ล็อกอิน Supabase ----------
   schema เปิด RLS ไว้ ถ้าตั้ง policy ให้เฉพาะผู้ใช้ที่ล็อกอิน (แนะนำ)
   ต้องล็อกอินก่อนถึงจะอ่านข้อมูลได้ — anon key เปล่า ๆ จะได้ 0 แถว */
function rbToken(){
  if(RBDATA.token === null){
    try{ RBDATA.token = localStorage.getItem(RB_TOKEN_KEY) || ''; }catch(e){ RBDATA.token = ''; }
  }
  return RBDATA.token;
}
async function rbSignIn(){
  const email = (document.getElementById('rbEmail') || {}).value || '';
  const pass  = (document.getElementById('rbPass')  || {}).value || '';
  if(!rbConfigured()) return toast('ใส่ Project URL และ anon key ก่อน', 'bad');
  if(!email || !pass) return toast('ใส่อีเมลและรหัสผ่านของผู้ใช้ใน Supabase', 'bad');
  const c = rbCfg();
  try{
    const res = await fetch(c.url + '/auth/v1/token?grant_type=password', {
      method:'POST',
      headers:{'apikey':c.anonKey, 'Content-Type':'application/json'},
      body: JSON.stringify({email:email, password:pass}),
    });
    const body = await res.json();
    if(!res.ok || !body.access_token) throw new Error(body.error_description || body.msg || ('HTTP ' + res.status));
    RBDATA.token = body.access_token;
    try{ localStorage.setItem(RB_TOKEN_KEY, RBDATA.token); }catch(e){}
    toast('ล็อกอิน Supabase สำเร็จ', 'good');
    rbLoad(true);
  }catch(e){
    toast('ล็อกอินไม่สำเร็จ — ' + (e.message || e), 'bad');
  }
}
function rbSignOut(){
  RBDATA.token = '';
  try{ localStorage.removeItem(RB_TOKEN_KEY); }catch(e){}
  RBDATA.status = 'idle';
  toast('ออกจากระบบ Supabase แล้ว');
  render();
}

/* ---------- ดึงข้อมูล ---------- */
async function rbGet(table, query){
  const c = rbCfg();
  const res = await fetch(c.url + '/rest/v1/' + table + '?' + query, {
    headers:{'apikey':c.anonKey, 'Authorization':'Bearer ' + (rbToken() || c.anonKey), 'Accept':'application/json'},
  });
  if(!res.ok){
    const body = await res.text();
    throw new Error(table + ' — HTTP ' + res.status + ' ' + body.slice(0, 180));
  }
  return await res.json();
}
// PostgREST ตัดที่ 1000 แถว ตาราง BOM มีเป็นหมื่น จึงต้องไล่ทีละหน้า
async function rbGetAll(table, select, order){
  const out = [];
  for(let off = 0; ; off += RB_PAGE){
    const q = 'select=' + select + (order ? '&order=' + order : '') + '&limit=' + RB_PAGE + '&offset=' + off;
    const chunk = await rbGet(table, q);
    out.push.apply(out, chunk);
    if(chunk.length < RB_PAGE || off > 200000) break;
  }
  return out;
}

const RB_SELECT = {
  books:     '*',
  formulas:  '*',
  colors:    '*',
  customers: '*',
  products:  '*',
  standards: 'book_code,item_code,item_name,dept,rubber_type,length_txt,hole_txt,outer_txt,' +
             'weight_per_strand_g,head_allowance_kg,joint_scrap_pct,general_scrap_pct,' +
             'formula_code,source_rows,name_variants',
  bom:       'book_code,src_row,product_item,rb_code,rb_code_std,rb_name,color_code,formula_code,' +
             'rb_weight_g,qty_per_set,cut_length,cut_length_unit,pcs_per_strand,pcs_unit,' +
             'qty_per_gr,qty_per_gr_unit,rb_uom',
  // ไม่ดึง std_snapshot มาด้วย — เป็น jsonb ก้อนใหญ่ที่หน้าจอนี้ยังไม่ได้ใช้
  orders:    'book_code,src_row,seq,production_order_no,work_order_no,customer_name,fg_code,' +
             'rb_code,rb_name,color,qty_kg,mixing_strands,rb_strands,head_allowance_kg,' +
             'joint_allowance_kg,general_scrap_kg,other_dept_scrap_kg,mixing_start,injection_due,hcm_due',
};

async function rbLoad(force){
  if(RBDATA.status === 'loading') return;
  if(RBDATA.status === 'ready' && !force) return;
  if(!rbConfigured()){
    RBDATA.status = 'error';
    RBDATA.error  = 'ยังไม่ได้ตั้งค่าการเชื่อมต่อ — ใส่ Project URL และ anon key ที่หน้า ตั้งค่าข้อมูลหลัก → Supabase (ข้อมูลจริง)';
    render();
    return;
  }
  RBDATA.status = 'loading'; RBDATA.error = '';
  render();
  try{
    const [books, formulas, standards, bom, orders, colors, customers, products] = await Promise.all([
      rbGetAll('rb_books',            RB_SELECT.books,     'code'),
      rbGetAll('rb_formulas',         RB_SELECT.formulas,  'book_code,formula_code'),
      rbGetAll('rb_item_standards',   RB_SELECT.standards, 'book_code,item_code'),
      rbGetAll('rb_bom_lines',        RB_SELECT.bom,       'book_code,src_row'),
      rbGetAll('rb_work_order_lines', RB_SELECT.orders,    'book_code,src_row'),
      rbGetAll('rb_colors',           RB_SELECT.colors,    'book_code,seq'),
      rbGetAll('rb_customers',        RB_SELECT.customers, 'book_code,seq'),
      rbGetAll('rb_products',         RB_SELECT.products,  'book_code,seq'),
    ]);
    Object.assign(RBDATA, {books, formulas, standards, bom, orders, colors, customers, products});
    RBDATA.stdIdx = {};
    standards.forEach(s=>{ RBDATA.stdIdx[s.book_code + '|' + s.item_code] = s; });
    RBDATA.status   = 'ready';
    RBDATA.loadedAt = Date.now();
    const total = books.length + formulas.length + standards.length + bom.length + orders.length;
    if(total === 0){
      // ไม่ error แต่ไม่ได้แถวเลย = RLS บล็อกอยู่ (หรือยังไม่ได้นำเข้าข้อมูล)
      RBDATA.error = 'เชื่อมต่อได้แต่อ่านไม่ได้สักแถว — ปกติแปลว่า RLS ยังไม่มี policy ให้อ่าน ' +
                     'ให้รัน supabase/rb_planning/policies.sql แล้วล็อกอินด้วยผู้ใช้ Supabase ก่อน';
    } else {
      toast('โหลดข้อมูลจริงแล้ว ' + fmt(total) + ' แถว', 'good');
    }
  }catch(e){
    RBDATA.status = 'error';
    RBDATA.error  = String(e.message || e);
  }
  render();
}

  const byCust = {};
  RBDATA.orders.forEach(o=>{
    const k = o.customer_name || '(ไม่ระบุ)';
    byCust[k] = (byCust[k] || 0) + num(o.qty_kg);
  });
  const topCust = Object.keys(byCust).sort((a,b)=>byCust[b]-byCust[a]).slice(0,10);
  const maxCust = topCust.length ? byCust[topCust[0]] : 0;

  // รหัสที่ใช้ใน BOM แต่ยังไม่มีมาตรฐาน — ช่องว่างของข้อมูลต้นทาง
  const missing = {};
  RBDATA.bom.forEach(l=>{
    if(l.rb_code_std && !rbStd(l.book_code, l.rb_code_std)) missing[l.book_code + '|' + l.rb_code_std] = (missing[l.book_code + '|' + l.rb_code_std] || 0) + 1;
  });
  const missKeys = Object.keys(missing).sort((a,b)=>missing[b]-missing[a]);

  return `
  ${head}
  <div class="kpi-grid">
    ${h_kpi('สมุดงาน', fmt(RBDATA.books.length) + '<small>เล่ม</small>', {text: RBDATA.books.map(b=>b.code).join(' · ')})}
    ${h_kpi('สูตรยาง', fmt(RBDATA.formulas.length), {text:'มาตรฐานการตียาง'}, 'c2')}
    ${h_kpi('มาตรฐานชิ้นงาน', fmt(RBDATA.standards.length), {text:'รหัส RB ที่มีค่ามาตรฐาน'})}
    ${h_kpi('รหัสสินค้า', fmt(RBDATA.products.length), {text:'ทะเบียนสินค้าสำเร็จรูป'})}
    ${h_kpi('บรรทัด BOM', fmt(RBDATA.bom.length), {text: fmt(missKeys.length) + ' รหัสยังไม่มีมาตรฐาน', cls: missKeys.length ? 'warn' : ''}, missKeys.length ? 'cb' : '')}
    ${h_kpi('ใบสั่งงาน', fmt(RBDATA.orders.length) + '<small>บรรทัด</small>',
      {text: fmt(sum(RBDATA.orders, o=>num(o.qty_kg)), 0) + ' กก. รวมทุกเล่ม'}, 'c2')}
  </div>

  <div class="panel">
    <h3>จำนวนสั่งงานรายเดือน (กก.)</h3>
    ${rbLoadedNote()}
    ${months.length ? chartHolder('rbMonthChart', 'tall') : h_empty('ไม่มีวันที่เริ่มตียางในข้อมูล')}
  </div>

  <div class="grid2b">
    <div class="panel" style="margin-bottom:0;">
      <h3>สรุปรายสมุดงาน</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>สมุดงาน</th><th class="num">สูตรยาง</th><th class="num">มาตรฐาน</th><th class="num">สินค้า</th><th class="num">BOM</th><th class="num">ใบสั่งงาน</th><th class="num">รวม กก.</th></tr></thead>
        <tbody>${byBook.map(b=>`<tr>
          <td><div class="strong">${esc(b.name)}</div><div class="faint mono" style="font-size:10.5px;">${esc(b.code)}</div></td>
          <td class="num mono">${fmt(b.formulas)}</td>
          <td class="num mono">${fmt(b.standards)}</td>
          <td class="num mono">${fmt(b.products)}</td>
          <td class="num mono">${fmt(b.bom)}</td>
          <td class="num mono">${fmt(b.orders)}</td>
          <td class="num mono strong">${fmt(b.kg, 1)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>

    <div class="panel" style="margin-bottom:0;">
      <h3>ลูกค้าที่สั่งมากที่สุด</h3>
      <div class="panel-note">รวมทุกสมุดงาน คิดจากจำนวนสั่งงาน (กก.)</div>
      ${topCust.length ? `<div class="table-wrap"><table>
        <thead><tr><th>ลูกค้า</th><th class="num">กก.</th><th style="width:38%;"></th></tr></thead>
        <tbody>${topCust.map(c=>`<tr>
          <td style="max-width:240px;white-space:normal;">${esc(c)}</td>
          <td class="num mono">${fmt(byCust[c], 1)}</td>
          <td>${h_bar(byCust[c], maxCust, '', '')}</td>
        </tr>`).join('')}</tbody>
      </table></div>` : h_empty('ไม่มีข้อมูลใบสั่งงาน')}
    </div>
  </div>

  ${missKeys.length ? `<div class="panel">
    <h3>รหัสที่ใช้ใน BOM แต่ยังไม่มีแถวใน DATA STANDARD</h3>
    <div class="panel-note">ช่องว่างของข้อมูลต้นทาง ไม่ใช่ปัญหาของการนำเข้า — เติมในไฟล์ Excel แล้วนำเข้าใหม่ได้</div>
    <div class="table-wrap"><table>
      <thead><tr><th>สมุดงาน</th><th>รหัสชิ้นงาน</th><th class="num">ถูกใช้ (บรรทัด)</th></tr></thead>
      <tbody>${missKeys.slice(0,25).map(k=>{
        const p = k.split('|');
        return `<tr><td>${esc(rbBookName(p[0]))}</td><td class="mono acc-t">${esc(p[1])}</td><td class="num mono">${fmt(missing[k])}</td></tr>`;
      }).join('')}</tbody>
    </table></div>
    ${missKeys.length > 25 ? `<div class="panel-note">แสดง 25 จาก ${fmt(missKeys.length)} รหัส</div>` : ''}
  </div>` : ''}`;
};

/* ---------- หน้า: ใบสั่งงานจริง ---------- */
VIEWS.rbOrders = function(){

  const head = h_header('RB · WORK ORDERS', 'ใบสั่งงานจริง',
    'ข้อมูลจากชีต Chronicle_Working — หนึ่งใบสั่งผลิตมีได้หลายบรรทัด (คนละรหัส RB คนละสี)',

  const ui   = state.ui.rb;

  const q    = String(ui.oq || '').trim().toLowerCase();

  if(q) rows = rows.filter(o=>
    rbMatch(o.production_order_no, q) || rbMatch(o.work_order_no, q) || rbMatch(o.customer_name, q) ||
    rbMatch(o.fg_code, q) || rbMatch(o.rb_code, q) || rbMatch(o.rb_name, q) || rbMatch(o.color, q));

  const kg    = sum(rows, o=>num(o.qty_kg));
  const custs = {}; rows.forEach(o=>{ if(o.customer_name) custs[o.customer_name] = 1; });

  const grouped = ui.ogroup === 'po';
  const poList  = Object.keys(pos).sort();

  return `

  ${rbBookChips()}
  <div class="panel">
    <div class="toolbar">
      <div class="fgroup grow">
        <span class="flabel">ค้นหา</span>
        <input class="input" data-fid="rboq" value="${esc(ui.oq || '')}" placeholder="เลขใบสั่งผลิต / ใบสั่งงาน / ลูกค้า / รหัสสินค้า / รหัส RB / สี"

      <div class="fgroup">
        <span class="flabel">มุมมอง</span>
        <div class="chipbar">
          <button class="chip${!grouped?' on':''}" onclick="uset('rb.ogroup','line')">รายบรรทัด</button>
          <button class="chip${grouped?' on':''}" onclick="uset('rb.ogroup','po')">สรุปต่อใบสั่งผลิต</button>
        </div>
      </div>
    </div>

    <div class="kpi-grid g4">
      ${h_kpi('บรรทัดที่ตรงเงื่อนไข', fmt(rows.length), {text:'จากทั้งหมด ' + fmt(RBDATA.orders.filter(o=>o.book_code===book).length) + ' บรรทัด'})}
      ${h_kpi('ใบสั่งผลิต', fmt(poList.length), {text:'เลขที่ไม่ซ้ำกัน'}, 'c2')}
      ${h_kpi('รวมจำนวนสั่งงาน', fmt(kg, 1) + '<small>กก.</small>', {text:'เฉพาะที่กรอกจำนวนไว้'})}
      ${h_kpi('ช่วงวันเริ่มตียาง', dates.length ? esc(fmtDate(dates[0])) + ' – ' + esc(fmtDate(dates[dates.length-1])) : '—',
        {text: fmt(Object.keys(custs).length) + ' ลูกค้า'}, 'c2')}
    </div>

    ${!rows.length ? h_empty('ไม่พบใบสั่งงานที่ตรงเงื่อนไข') : (grouped ? `
    <div class="table-wrap"><table class="wide">
      <thead><tr><th>เลขที่ใบสั่งผลิต</th><th>ลูกค้า</th><th class="num">บรรทัด</th><th class="num">รหัสสินค้า</th>
        <th class="num">รวม กก.</th><th>เริ่มตียาง</th><th>เสร็จฉีด</th><th>เสร็จ HCM</th></tr></thead>
      <tbody>${poList.map(p=>{
        const g = rows.filter(o=>o.production_order_no === p);
        const fg = {}; g.forEach(o=>{ if(o.fg_code) fg[o.fg_code] = 1; });
        const ms = g.map(o=>o.mixing_start).filter(Boolean).sort();
        const hs = g.map(o=>o.hcm_due).filter(Boolean).sort();
        const is = g.map(o=>o.injection_due).filter(Boolean).sort();
        return `<tr>
          <td class="mono acc-t strong">${esc(p)}</td>
          <td style="max-width:220px;white-space:normal;">${esc(g[0].customer_name || '—')}</td>
          <td class="num mono">${fmt(g.length)}</td>
          <td class="num mono">${fmt(Object.keys(fg).length)}</td>
          <td class="num mono strong">${fmt(sum(g, o=>num(o.qty_kg)), 2)}</td>
          <td class="mono nowrap">${ms.length ? esc(fmtDate(ms[0])) : '—'}</td>
          <td class="mono nowrap">${is.length ? esc(fmtDate(is[is.length-1])) : '—'}</td>
          <td class="mono nowrap">${hs.length ? esc(fmtDate(hs[hs.length-1])) : '—'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>` : `
    <div class="table-wrap"><table class="wide">
      <thead><tr><th class="num">#</th><th>ใบสั่งผลิต</th><th>ใบสั่งงาน</th><th>ลูกค้า</th><th>รหัสสินค้า</th>
        <th>ชิ้นงาน RB</th><th>สี</th><th class="num">กก.</th><th class="num">เส้นตียาง</th><th class="num">เส้น RB</th>
        <th>เริ่มตียาง</th><th>เสร็จ HCM</th></tr></thead>
      <tbody>${rows.slice(0, 400).map(o=>`<tr>
        <td class="num mono faint">${fmt(o.seq)}</td>
        <td class="mono acc-t strong">${esc(o.production_order_no || '—')}</td>
        <td class="mono">${esc(o.work_order_no || '—')}</td>
        <td style="max-width:180px;white-space:normal;">${esc(o.customer_name || '—')}</td>
        <td class="mono">${esc(o.fg_code || '—')}</td>
        <td>
          <div class="mono acc-t" style="font-weight:600;">${esc(o.rb_code || '—')}</div>
          <div class="faint" style="font-size:11px;line-height:1.4;max-width:300px;white-space:normal;">${esc(o.rb_name || '')}</div>
        </td>
        <td style="max-width:150px;white-space:normal;">${esc(o.color || '—')}</td>
        <td class="num mono strong">${fmt(o.qty_kg, 2)}</td>
        <td class="num mono">${fmt(o.mixing_strands, 2)}</td>
        <td class="num mono">${fmt(o.rb_strands)}</td>
        <td class="mono nowrap">${esc(fmtDate(o.mixing_start))}</td>
        <td class="mono nowrap">${esc(fmtDate(o.hcm_due))}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    ${rows.length > 400 ? `<div class="panel-note">แสดง 400 จาก ${fmt(rows.length)} บรรทัด — ใช้ช่องค้นหาเพื่อกรองให้แคบลง</div>` : ''}`)}
  </div>`;
};

/* ---------- หน้า: BOM จริง ---------- */
VIEWS.rbBom = function(){
  const gate = rbGate();
  const head = h_header('RB · BILL OF MATERIALS', 'BOM จริง',
    'สินค้าหนึ่งตัวใช้ชิ้นงาน RB อะไรบ้าง จากชีต DATA BOM — ต่อค่ามาตรฐานจาก DATA STANDARD ให้อัตโนมัติ',
    rbConfigured() ? rbHeadActions() : '');
  if(gate) return head + gate;

  const ui   = state.ui.rb;
  const book = rbBook();
  const bom  = RBDATA.bom.filter(l=>l.book_code === book);

  // รายชื่อสินค้าที่มีสูตรจริง (ไม่ใช่ทะเบียนทั้งหมด)
  const items = [];
  const seen  = {};
  bom.forEach(l=>{ if(!seen[l.product_item]){ seen[l.product_item] = 1; items.push(l.product_item); } });
  items.sort();

  const sel   = seen[ui.item] ? ui.item : (items[0] || '');
  const lines = bom.filter(l=>l.product_item === sel);

  // ใช้ที่ไหนบ้าง — ค้นจากรหัส RB
  const wu  = String(ui.wu || '').trim().toLowerCase();
  const wuRows = wu ? bom.filter(l=>rbMatch(l.rb_code_std, wu) || rbMatch(l.rb_code, wu) || rbMatch(l.rb_name, wu)) : [];
  const wuBy = {};
  wuRows.forEach(l=>{ wuBy[l.product_item] = (wuBy[l.product_item] || 0) + 1; });

  const noStd = lines.filter(l=>l.rb_code_std && !rbStd(book, l.rb_code_std)).length;

  return `
  ${head}
  ${rbBookChips()}
  <div class="panel">
    <div class="toolbar">
      <div class="fgroup grow">
        <span class="flabel">รหัสสินค้า (พิมพ์เพื่อค้นหา)</span>
        <input class="input mono" data-fid="rbitem" list="rbItemList" value="${esc(sel)}"
          placeholder="เช่น ACG-01-A" oninput="uset('rb.item',this.value)">
        <datalist id="rbItemList">${items.slice(0, 3000).map(c=>`<option value="${esc(c)}"></option>`).join('')}</datalist>
        <div class="field-hint">มีสินค้าที่มีสูตร ${fmt(items.length)} รายการในสมุดงานนี้</div>
      </div>
    </div>

    ${!lines.length ? h_empty('ไม่พบสูตรของรหัสนี้', 'ลองพิมพ์รหัสให้ตรงกับที่มีในรายการ') : `
    <div class="kpi-grid g4">
      ${h_kpi('ชิ้นงาน RB ที่ใช้', fmt(lines.length) + '<small>บรรทัด</small>', {text:'ต่อสินค้า 1 ชุด'})}
      ${h_kpi('สูตรยางที่เกี่ยวข้อง', fmt(Object.keys(lines.reduce((a,l)=>{ if(l.formula_code) a[l.formula_code]=1; return a; },{})).length),
        {text:'จำนวนสูตรที่ไม่ซ้ำกัน'}, 'c2')}
      ${h_kpi('น้ำหนัก RB รวม', fmt(sum(lines, l=>num(l.rb_weight_g)), 1) + '<small>g.</small>', {text:'ผลรวมคอลัมน์ นน. RB'})}
      ${h_kpi('ยังไม่มีมาตรฐาน', fmt(noStd) + '<small>บรรทัด</small>',
        {text: noStd ? 'รหัสเหล่านี้ยังไม่มีแถวใน DATA STANDARD' : 'ต่อมาตรฐานได้ครบทุกบรรทัด', cls: noStd ? 'warn' : 'good'},
        noStd ? 'cb' : '')}
    </div>

    <div class="table-wrap"><table class="wide">
      <thead><tr><th>ชิ้นงาน RB</th><th>สูตร/ประเภท</th><th>สี</th><th class="num">ใช้ต่อชุด</th>
        <th class="num">ความยาวตัด</th><th class="num">ชิ้น/เส้น</th><th class="num">ต่อ 1 GR</th><th>หน่วยนับ</th>
        <th class="num">นน./เส้น (g.)</th><th class="num">เผื่อเสีย</th></tr></thead>
      <tbody>${lines.map(l=>{
        const s = rbStd(book, l.rb_code_std);
        return `<tr>
          <td>
            <div class="mono acc-t" style="font-weight:600;">${esc(l.rb_code_std || l.rb_code)}</div>
            <div class="faint" style="font-size:11px;line-height:1.4;max-width:340px;white-space:normal;">${esc(l.rb_name || '')}</div>
            ${s ? '' : '<span class="pill warn" style="margin-top:3px;">ไม่มีมาตรฐาน</span>'}
          </td>
          <td class="mono nowrap">${esc(l.formula_code || '—')}<span class="faint"> / ${esc(l.rubber_type || l.color_code || '—')}</span></td>
          <td class="mono">${esc(l.color_code || '—')}</td>
          <td class="num mono strong">${fmt(l.qty_per_set, 4)}</td>
          <td class="num mono">${fmt(l.cut_length, 2)} <span class="faint">${esc(l.cut_length_unit || '')}</span></td>
          <td class="num mono">${fmt(l.pcs_per_strand, 2)}</td>
          <td class="num mono">${fmt(l.qty_per_gr, 2)}</td>
          <td>${esc(l.rb_uom || '—')}</td>
          <td class="num mono">${s ? fmt(s.weight_per_strand_g, 1) : '—'}</td>
          <td class="num mono">${s && s.general_scrap_pct != null ? pct(num(s.general_scrap_pct) * 100, 1) : '—'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`}
  </div>

  <div class="panel">
    <h3>ชิ้นงาน RB นี้ถูกใช้ที่ไหนบ้าง</h3>
    <div class="panel-note">พิมพ์รหัสหรือชื่อชิ้นงาน RB เพื่อดูว่าสินค้าตัวไหนใช้บ้าง (where-used)</div>
    <div class="toolbar">
      <div class="fgroup grow">
        <input class="input mono" data-fid="rbwu" value="${esc(ui.wu || '')}"
          placeholder="เช่น RB-B0005-02-132-9-25 หรือ สายโก" oninput="uset('rb.wu',this.value)">
      </div>
    </div>
    ${!wu ? h_empty('พิมพ์รหัสเพื่อค้นหา') : (!wuRows.length ? h_empty('ไม่พบชิ้นงานที่ตรงกับคำค้น') : `
    <div class="table-wrap"><table>
      <thead><tr><th>รหัสสินค้า</th><th class="num">จำนวนบรรทัดในสูตร</th><th class="num"></th></tr></thead>
      <tbody>${Object.keys(wuBy).sort().slice(0, 100).map(p=>`<tr>
        <td class="mono acc-t strong">${esc(p)}</td>
        <td class="num mono">${fmt(wuBy[p])}</td>
        <td class="num"><button class="btn btn-xs" onclick="uset('rb.item','${esc(p)}')">ดูสูตร</button></td>
      </tr>`).join('')}</tbody>
    </table></div>
    <div class="panel-note">พบ ${fmt(Object.keys(wuBy).length)} สินค้า จาก ${fmt(wuRows.length)} บรรทัด${Object.keys(wuBy).length > 100 ? ' (แสดง 100 รายการแรก)' : ''}</div>`)}
  </div>`;
};

/* ---------- หน้า: ข้อมูลหลักจริง ---------- */
const RB_MASTER_TABS = [
  {k:'standards', label:'มาตรฐานชิ้นงาน'},
  {k:'formulas',  label:'สูตรยาง'},
  {k:'colors',    label:'รหัสสี'},

  {k:'products',  label:'รหัสสินค้า'},
];

VIEWS.rbMaster = function(){
  const gate = rbGate();
  const head = h_header('RB · MASTER DATA', 'ข้อมูลหลักจริง',
    'มาตรฐานชิ้นงาน สูตรยาง รหัสสี ลูกค้า และทะเบียนรหัสสินค้า จากไฟล์ Excel ต้นทาง',
    rbConfigured() ? rbHeadActions() : '');
  if(gate) return head + gate;

  const ui   = state.ui.rb;
  const book = rbBook();
  const tab  = RB_MASTER_TABS.some(t=>t.k === ui.tab) ? ui.tab : 'standards';
  const q    = String(ui.mq || '').trim().toLowerCase();

  const counts = {
    standards: RBDATA.standards.filter(x=>x.book_code===book).length,
    formulas:  RBDATA.formulas.filter(x=>x.book_code===book).length,
    colors:    RBDATA.colors.filter(x=>x.book_code===book).length,
    customers: RBDATA.customers.filter(x=>x.book_code===book).length,
    products:  RBDATA.products.filter(x=>x.book_code===book).length,
  };

  let body = '';
  if(tab === 'standards'){
    let rows = RBDATA.standards.filter(x=>x.book_code===book);
    if(q) rows = rows.filter(s=>rbMatch(s.item_code, q) || rbMatch(s.item_name, q) || rbMatch(s.formula_code, q));
    body = !rows.length ? h_empty('ไม่พบมาตรฐานที่ตรงเงื่อนไข') : `
      <div class="table-wrap"><table class="wide">

function submitMaster(){
  const m = state.modal, def = MASTER_DEFS[m.kind], f = m.form, errs = [];
  def.fields.forEach(fd=>{
    if(fd.required && !String(f[fd.k]||'').trim()) errs.push('ต้องกรอก ' + fd.label);
    if(fd.type === 'number') f[fd.k] = num(f[fd.k]);
  });
  if(!m.editing && DB[m.kind].some(x=>x[def.key] === f[def.key])) errs.push('รหัสนี้มีอยู่แล้ว');
  if(errs.length){ m.errors = errs; render(); return; }
  if(m.editing){
    const row = DB[m.kind].find(x=>x[def.key]===m.editing);
    Object.assign(row, f);
  }else{
    DB[m.kind].push(Object.assign({}, f));
  }
  invalidateInv(); saveDB(); closeModal();
  toast('บันทึก' + def.title + 'แล้ว', 'good');
}
function deleteMaster(kind, key){
  const def = MASTER_DEFS[kind];
  // กันลบข้อมูลที่ยังถูกอ้างถึงอยู่ ไม่งั้นหน้าอื่นจะแสดงรหัสค้างที่ไม่มีข้อมูล
  const refs = [];
  if(kind === 'items'){
    if(DB.orders.some(o=>o.item===key)) refs.push('ใบสั่งผลิต');
    if(DB.bom.some(b=>b.parent===key||b.child===key)) refs.push('สูตร BOM');
    if(DB.txns.some(t=>t.code===key)) refs.push('รายการคลัง');
    if(DB.pos.some(p=>p.lines.some(l=>l.code===key))) refs.push('ใบสั่งซื้อ');
  }
  if(kind === 'machines'){
    if(DB.orders.some(o=>o.machine===key)) refs.push('ใบสั่งผลิต');
    if(DB.downtime.some(d=>d.machine===key)) refs.push('บันทึกเครื่องหยุด');
  }
  if(kind === 'vendors'){
    if(DB.items.some(i=>i.vendor===key)) refs.push('ข้อมูลสินค้า');
    if(DB.pos.some(p=>p.vendor===key)) refs.push('ใบสั่งซื้อ');
  }
  if(kind === 'customers' && DB.orders.some(o=>o.customer===key)) refs.push('ใบสั่งผลิต');
  if(kind === 'employees'){
    const emp = DB.employees.find(e=>e.code===key);
    if(emp && allLogs().some(l=>l.emp===emp.name)) refs.push('บันทึกผลผลิต');
  }
  if(refs.length){ toast('ลบไม่ได้ — ยังถูกอ้างถึงใน: ' + refs.join(', '), 'bad'); return; }
  if(!confirm('ลบรายการ ' + key + ' ?')) return;
  DB[kind] = DB[kind].filter(x=>x[def.key]!==key);
  invalidateInv(); saveDB(); toast('ลบแล้ว'); render();
}

/* ---------- 10. Boot ---------- */
let appStarted = false;

async function startApp(){
  if(appStarted) return;
  appStarted = true;
  document.getElementById('authGate').classList.add('hidden');
  document.getElementById('appRoot').classList.remove('hidden');

  const loaded = await loadAppDB();
  if(loaded){
    DB = loaded;
  }else{
    DB = seedDB();
    await saveDB(true);
    setTimeout(()=>toast('สร้างข้อมูลตัวอย่างให้แล้ว — ล้างได้ที่ ตั้งค่าข้อมูลหลัก → ข้อมูลระบบ', 'good'), 600);
  }
  invalidateInv();

  // route จาก hash เพื่อให้ปุ่ม back/forward และการ bookmark ใช้ได้
  const fromHash = (location.hash || '').replace('#','');
  if(fromHash && VIEWS[fromHash]) state.route = fromHash;
  rbMaybeLoad(state.route);
  window.addEventListener('hashchange', ()=>{
    const r = (location.hash || '').replace('#','');
    if(r && VIEWS[r] && r !== state.route){ state.route = r; rbMaybeLoad(r); render(); }
  });

  const el = document.getElementById('sbSaved');
  if(el) el.textContent = DB.seededAt ? 'ข้อมูลตั้งต้น ' + fmtDateTime(DB.seededAt) : 'พร้อมใช้งาน';
  render();
}

  const input = document.getElementById('authInput');

  const card = document.getElementById('authCard');
  const val = input.value;
  if(!val){ err.textContent = 'กรุณาใส่รหัสผ่าน'; return; }
  let hash;
  try{
    hash = await sha256(val);
  }catch(e){
    // crypto.subtle ใช้ได้เฉพาะบน https หรือ localhost — เปิดไฟล์แบบ file:// จะพัง
    err.textContent = 'เบราว์เซอร์นี้เข้ารหัสไม่ได้ (ต้องเปิดผ่าน https หรือ localhost ไม่ใช่ file://)';
    return;
  }
  if(hash === currentAuthHash()){
    localStorage.setItem(AUTH_LS_KEY, JSON.stringify({at:Date.now()}));
    err.textContent = '';
    startApp();
  }else{
    err.textContent = 'รหัสผ่านไม่ถูกต้อง';
    card.classList.add('shake');
    setTimeout(()=>card.classList.remove('shake'), 400);
    input.select();
  }
}

function checkExistingAuth(){
  try{
    const raw = localStorage.getItem(AUTH_LS_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(d && d.at && (Date.now() - d.at) < AUTH_TTL_MS) return true;
    localStorage.removeItem(AUTH_LS_KEY);
  }catch(e){}
  return false;
}

document.getElementById('authSubmit').addEventListener('click', tryUnlock);
document.getElementById('authInput').addEventListener('keydown', e=>{ if(e.key === 'Enter') tryUnlock(); });
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  localStorage.removeItem(AUTH_LS_KEY);
  location.reload();
});

if(checkExistingAuth()) startApp();
else setTimeout(()=>{ const i = document.getElementById('authInput'); if(i) i.focus(); }, 100);
</script>
</body>
